name: Verify
on:
  push:
    branches: [main, cloud/sx-evidence-c37, cloud/sx-evidence-g23-r4, cloud/sx-evidence-c-i816, cloud/sx-evidence-c-i822, cloud/sx-evidence-defect1, cloud/sx-evidence-u1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [core, custody, history, program, code, people, integrations, cloud, clouds, identity, trackers, browser, browser-data]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Read installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Browser archives do not contain the runner's system libraries.
      - name: Install Chromium and system dependencies (cache miss)
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies (cache hit)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Install portal browsers
        if: matrix.shard == 'history'
        run: node scripts/install-portal-browsers.mjs
      - run: pnpm exec rer verify
        env:
          RER_VERIFY_WORKERS: '2'
          VERIFY_SHARD: ${{ matrix.shard }}
          WRANGLER_SEND_METRICS: 'false'
