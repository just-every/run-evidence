<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence portal capture</title>
<style>body{font:14px system-ui,sans-serif;box-sizing:border-box;margin:0;padding:20px;width:360px;max-width:100vw;background:#f7f7f3;color:#242824}h1{font-size:20px}label{display:block;margin:14px 0}input,button{font:inherit;box-sizing:border-box;width:100%;padding:9px;border:1px solid #93998e;border-radius:6px}button{margin:5px 0;background:#e5eadf;cursor:pointer}p{line-height:1.5;overflow-wrap:anywhere}li{overflow-wrap:anywhere}</style>
<h1>Portal capture</h1><p>Capture each page manually, then import for review. Fill exact approved text and choices after a fresh scan. Attach only exact approved documents. Forms are never submitted.</p>
<form id="connect"><label>Evidence installation URL<input name="installation" type="url" required placeholder="https://evidence.example.test"></label><label>Capture-only API token<input name="token" type="password" required autocomplete="off"></label><label>Program ID<input name="program" required></label><label>Questionnaire name<input name="name" required maxlength="200"></label><button>Connect for this browser session</button></form>
<label>Page identifier<input id="page-id" maxlength="200" placeholder="Unique page or step name"></label><button id="capture" type="button">Capture current page</button><ul id="pages"></ul><button id="import" type="button">Import captured pages</button><label>Questionnaire ID<input id="questionnaire-id"></label><label>Approved draft ID<input id="draft-id"></label><label>Approved recipient email<input id="recipient" type="email"></label><button id="fill" type="button">Re-scan and fill approved fields</button><button id="clear" type="button">Clear session and captures</button><p id="status" role="status"></p>
<script src="scan.js"></script><script src="popup.js"></script></html>
